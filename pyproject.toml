[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-forge-backend"
version = "1.0.0"
description = "Prism Forge - Multi-agent AI assistant backend"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
maintainers = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["ai", "assistant", "multi-agent", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.4.0",
    "python-multipart==0.0.18",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["backend/tests"]
pythonpath = ["backend"]